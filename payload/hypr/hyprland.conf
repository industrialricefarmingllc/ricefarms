source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/custom.conf
# Hyprland - lightweight single display Dell S2417DG 24" 2560x1440@165 122 DPI DP-1
# Mirrors sway config: DP-1 primary scale 1.25, DP-2/DP-3 disabled (P2415Q 4K off via kernel video=DP-2:d DP-3:d)
# For mixed DPI 4K reference see hyprland.conf.bak

# --- Monitors --- 3x Dell: S2417DG 1440p@165 (DP-1) + 2x P2415Q 4K@60 (DP-2/DP-3) — P2415Q enabled (removed video=DP-2:d DP-3:d from /etc/kernel/cmdline)
monitor=DP-2,3840x2160@60,0x0,2.4
monitor=DP-1,2560x1440@165,1600x0,1.6
monitor=DP-3,3840x2160@60,3200x0,2.4
monitor=HDMI-A-1,disable
monitor=eDP-1,preferred,auto,2  # internal LG 2736x1824 26x17cm ~267 PPI -> 200% (1368x912 logical)
monitor=,preferred,auto,1  # fallback if DP-1 name differs
workspace = 1, monitor:DP-1, persistent:true
workspace = 2, monitor:DP-1, persistent:true
workspace = 3, monitor:DP-1, persistent:true
workspace = 4, monitor:DP-2, persistent:true, gapsout:13,50,13,50
workspace = 5, monitor:DP-2, persistent:true, gapsout:13,50,13,50
workspace = 6, monitor:DP-2, persistent:true, gapsout:13,50,13,50
workspace = 7, monitor:DP-3, persistent:true, gapsout:13,50,13,50
workspace = 8, monitor:DP-3, persistent:true, gapsout:13,50,13,50
workspace = 9, monitor:DP-3, persistent:true, gapsout:13,50,13,50
workspace = 10, monitor:DP-2, persistent:false, gapsout:13,50,13,50
# Generalized: any future non-primary workspaces (11-20) also +28px Y (hardware-agnostic)
workspace = 11, gapsout:13,50,13,50
workspace = 12, gapsout:13,50,13,50
workspace = 13, gapsout:13,50,13,50
workspace = 14, gapsout:13,50,13,50
workspace = 15, gapsout:13,50,13,50
workspace = 16, gapsout:13,50,13,50
workspace = 17, gapsout:13,50,13,50
workspace = 18, gapsout:13,50,13,50
workspace = 19, gapsout:13,50,13,50
workspace = 20, gapsout:13,50,13,50

# --- Env for NVIDIA 580.178.04 GTX 1080 Ti (keep modeset=1 fbdev=1 in cmdline) ---
# Hyprland 0.56+ nvidia: direct backend stable with 580; keep xwayland via xorg-xwayland installed
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = GBM_BACKEND,nvidia-drm
# 2026-09-06: legacy (non-atomic) modeset. nvidia-drm atomic VT-switch restore
# intermittently commits a wrong mode (1440p@60 vs running @120 -> EINVAL on
# crtc 59) then stalls with no retry (black screens "forever"). Legacy
# setcrtc has no restore heuristic to get wrong. Revertible: delete this line.
env = AQ_NO_ATOMIC,1
env = WLR_NO_HARDWARE_CURSORS,0
env = XCURSOR_SIZE,16
env = HYPRCURSOR_SIZE,16
# DPI 122: 96*1.25=120, cursor 24*1.33~32 for 1.25 scale -> halved to 16
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,0
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11
env = GDK_SCALE,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
# Electron/Chromium Ozone Wayland - makes Helium/VSCode/Electron crisp (was xwayland blurry)
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = NIXOS_OZONE_WL,1
# FreeType classic ClearType look: v35 bytecode interpreter = sharper/Windows-like (default v40 is lighter)
env = FREETYPE_PROPERTIES,truetype:interpreter-version=35

# --- Autostart --- (Lucid) — qs now via hyprland.lua hl.on(hyprland.start) to avoid duplicate
exec-once = systemctl --user start bucklespring || pgrep -x buckle || buckle -s 25 -g 50 -p /home/nicerice/.local/share/bucklespring/kalih-box-white # systemd-managed, fallback
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = systemctl --user start skwd-walld
# awww only when skwd-wall is not the backend; its daemon owns the background otherwise
exec-once = sh -c 'systemctl --user is-active --quiet skwd-walld || exec awww-daemon'
# exec-once = qs
exec-once = hypridle
# Lucid background capture for quickshell glass (needs reload after rebuild: hyprctl plugin unload <path> && hyprctl plugin load <path>)
# Disabled 2026-09-03: suspected in two SEGVs (incl 01:05) — re-enable only for debugging; glass falls back to wallpaper
# exec-once = hyprctl plugin load /home/nicerice/src/lucid-capture/lucid-capture.so
# exec-once = dunst  # disabled - notifications off
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# Pibble disabled 2026-10-27 (source kept in ~/src/pibble; no daemon autostart).
# XWayland DPI for X11-only apps (force_zero_scaling=true means they must scale themselves).
# 192 = 96*2 matches the 200% scale of eDP-1; Steam's enable_dpi_scaling reads this.
exec-once = sh -c '[ -f ~/.Xresources ] && xrdb -merge ~/.Xresources'
# Steam autostart disabled 2026-10-27: it should only start when prompted.
# exec-once = pgrep -x steam > /dev/null || ~/.local/bin/steam-hidpi -silent
# Tobii Eye Tracker 5 hub (resident, no window, tracker sleeps until needed)
exec-once = tobii-gtk --background
# Tobii sensor awake ONLY while Elite Dangerous is focused (focus-gate watcher)
exec-once = ~/.config/hypr/scripts/tobii-elite-focus.py
# Vocal chain VAC (RODE -> Carla VST -> VST_OUT/VST_Mic) + exclusive-access enforcer
exec-once = systemctl --user start vac.service vac-enforcer.service
# exec-once = ~/.config/hypr/scripts/keyboard-hotplug.sh # disabled for VT stability # keep SUPER+left/right + F15 alive after USB replug
exec-once = sleep 1 && ~/.config/hypr/scripts/wallpaper-restore.sh
exec-once = ~/.config/hypr/scripts/watch-theme-mode.sh &
# hyprpaper disabled: using awww for surface-dots (uncomment if you want hyprpaper back)
# exec-once = hyprpaper
# linux-wallpaperengine (Almamu) / mpvpaper for videos: pibble owns animated
# picks (Settings.weScreens, empty = all outputs); awww owns statics.
# Manual variants live in ~/.config/hypr/scripts/wallpaper-engine.sh:
#   wallpaper-engine.sh 3707876915
#   wallpaper-engine.sh --per-monitor DP-2:2667198601 DP-1:2667198602 DP-3:2667198602
#   (stop it with: wallpaper-engine.sh stop)
# Keep desktop-toggle vt logic: Hyprland runs on tty7 via .zprofile exec

xwayland {
    force_zero_scaling = true
}

# Lucid blur fix
layerrule = xray 1, match:namespace quickshell
# NOTE: no blur layerrule for pibble-* — pibble-launcher is a fullscreen overlay
# layer that stays mapped even when closed, so blur behind it = fullscreen blur
# following the focused monitor. Pibble draws its own backdrop.

general {
    gaps_in = 10
    gaps_out = 8,50,8,50
    border_size = 1
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
}

dwindle {
    preserve_split = true
    smart_split = false
    split_width_multiplier = 1.0
    force_split = 0
    use_active_for_splits = true
}

decoration {
    # Corner radius source for every window. The *shape* of the corner is
    # the shared squircle smoothing f (PREFS > SHAPE > "Squircle corners" in
    # the Lucid settings, default 0.5 = classic squircle): the
    # liquid-glass-hypr plugin reads it live from
    # ~/.config/quickshell/lucidprefs/prefs.json (`squircleF`) via its
    # prefs.json tuner (plugin:liquidglass:squircle_f, registered default
    # 0.5) and draws its glass bodies with the matching superellipse SDF.
    # Limitation, by design: Hyprland core still clips window textures to a
    # circular round, so the 1px border ring (ring.frag) stays circular to
    # hug the clip - only the glass body/glow behind it follows f.
    rounding = 20
    blur {
        enabled = true
        size = 3
        passes = 2
    }
    shadow {
        enabled = true
        range = 32
        render_power = 2
        scale = 1.0
        offset = 0 10
        color = rgba(1a1a1a66)
        color_inactive = rgba(1a1a1a33)
    }
}

# Liquid glass: loaded via hyprland.lua (hl.exec_cmd plugin load), rules via
# hyprland.lua hl.window_rule kitty-glass + zen-glass. Kept disabled here to avoid double-load.
# Fixed 2026-09-04: removed stray `}` + bare top-level `screen_shader` (must be
# inside `decoration {}` or flat `decoration:screen_shader`). See hyprland.lua.
# exec-once = hyprctl plugin load ~/src/liquid-glass-hypr/liquidglass.so
# exec-once = /bin/sh -c '/home/nicerice/.config/hypr/scripts/apply-liquidglass-rules.sh'
# plugin defaults (src/liquid-glass-hypr/src/Config.cpp): windows = * (all)
# (comma-separated substring match on window class); window_tint_file applies
# to kitty only, Zen falls back to the theme tint.

animations {
    enabled = true
    bezier = easeOut, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5.29, easeOut
    animation = windowsOut, 1, 5.29, easeOut, popin 78%
    animation = border, 1, 10.58, default
    animation = borderangle, 1, 10.58, default
    animation = fade, 1, 5.29, default
    # NOTE: hyprland.lua is live; this block is fallback-only. Companion mode:
    # stock slide owns motion, goo plugin adds fade+scale — see hyprland.lua.
    animation = workspaces, 1, 4.43, default, slide
}

input {
    kb_layout = us,ru
    kb_model = pc105+inet
    kb_variant = ,phonetic_winkeys
    kb_options = grp:alt_shift_toggle,grp_led:scroll,terminate:ctrl_alt_bksp
    repeat_delay = 125
    repeat_rate = 125
    follow_mouse = 1
    resolve_binds_by_sym = true
    sensitivity = -0.5  # 75% speed (range -1.0 to 1.0, 0 = default)
    touchpad {
        natural_scroll = false
    }
}

# --- Keybinds (Lucid bar + launcher) ---
$mod = SUPER
bind = $mod, Return, exec, kitty
# SUPER tap on release — doesn't steal SUPER+ALT/Arrows or SUPER+SPACE
# Lucid launcher on bare SUPER (Pibble binds removed 2026-10-27).
bindr = SUPER, Super_L, exec, hyprctl dispatch 'hl.dsp.global("quickshell:launcher")'
bindr = SUPER, Super_R, exec, hyprctl dispatch 'hl.dsp.global("quickshell:launcher")'
bind = $mod, SPACE, exec, hyprctl switchxkblayout all next
bind = $mod, E, exec, qs ipc call -- moji toggle
bind = $mod, L, exec, qs ipc call -- lock lock
bind = $mod, S, exec, qs ipc call -- snap toggle
bind = $mod, comma, exec, qs ipc call -- settings open
bind = SUPER ALT, T, exec, ~/.config/hypr/scripts/theme-toggle.sh  # kitty/matugen light/dark toggle
# Pibble keybinds removed 2026-10-27; SUPER tap opens the Lucid launcher.
bind = $mod, W, exec, qs ipc call -- launcher wallpaper  # Lucid wallpaper picker
bind = ALT, F4, exec, qs ipc call global quickshell:powerMenu
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod, J, layoutmsg, togglesplit

bind = $mod, down, exec, /usr/local/bin/minimize-all
bind = $mod, F12, exec, /usr/local/bin/minimize-all
bind = $mod, D, exec, /usr/local/bin/minimize-all
bind = $mod SHIFT, down, exec, /usr/local/bin/pin-all
bind = $mod SHIFT, F12, exec, /usr/local/bin/pin-all
bind = $mod SHIFT, D, exec, /usr/local/bin/pin-all
bind = $mod, up, exec, /usr/local/bin/restore-all
bind = $mod, F11, exec, /usr/local/bin/restore-all
bind = $mod, U, exec, /usr/local/bin/restore-all
bind = $mod SHIFT, up, exec, /usr/local/bin/unpin-all
bind = $mod SHIFT, F11, exec, /usr/local/bin/unpin-all
bind = $mod SHIFT, U, exec, /usr/local/bin/unpin-all

# --- tmux-style prefix: CTRL+BackSpace once, then chain anything (sticky) ---
# One prefix press arms tmux mode; EVERY bind below stays in the submap and
# refreshes the 800ms timeout (timeout lives in hyprland.lua TMUX_TIMEOUT_MS).
# Only Esc exits explicitly. Second C-BackSpace just re-arms (never resets).
# e.g. C-BackSpace, arrows, space, C-z all chain without re-pressing prefix.
bind = CTRL, BackSpace, submap, tmux
submap = tmux
bind = , c, exec, qs ipc call -- launcher toggle
bind = CTRL, c, exec, qs ipc call -- launcher toggle
bind = , x, killactive,
bind = CTRL, x, killactive,
bind = , z, fullscreen, 1
bind = CTRL, z, fullscreen, 1
bind = , v, togglefloating,
bind = CTRL, v, togglefloating,
bind = , n, workspace, +1
bind = CTRL, n, workspace, +1
bind = , 1, workspace, 1
bind = CTRL, 1, workspace, 1
bind = , 2, workspace, 2
bind = CTRL, 2, workspace, 2
bind = , 3, workspace, 3
bind = CTRL, 3, workspace, 3
bind = , 4, workspace, 4
bind = CTRL, 4, workspace, 4
bind = , 5, workspace, 5
bind = CTRL, 5, workspace, 5
bind = , 6, workspace, 6
bind = CTRL, 6, workspace, 6
bind = , 7, workspace, 7
bind = CTRL, 7, workspace, 7
bind = , 8, workspace, 8
bind = CTRL, 8, workspace, 8
bind = , 9, workspace, 9
bind = CTRL, 9, workspace, 9
# Freed keys: C-BackSpace o / p / t / f intentionally disabled, mirroring the
# dev host's tmux `unbind -T prefix o/p/t/f` (~/.tmux.conf there). In tmux an
# unbound prefix key does nothing and ends the prefix table: swallow the key
# and reset the submap (re-entering it would keep the chain armed).
bind = , o, submap, reset
bind = CTRL, o, submap, reset
bind = , p, submap, reset
bind = CTRL, p, submap, reset
bind = , t, submap, reset
bind = CTRL, t, submap, reset
bind = , f, submap, reset
bind = CTRL, f, submap, reset
bind = , space, layoutmsg, togglesplit
bind = CTRL, space, layoutmsg, togglesplit
# F16 = open kitty from inside tmux mode too (global binds don't fire in submaps)
bind = , F16, exec, kitty
bind = CTRL, F16, exec, kitty
bind = , code:194, exec, kitty
bind = CTRL, code:194, exec, kitty
# F17 = open nautilus from inside tmux mode too
bind = , F17, exec, nautilus --new-window
bind = CTRL, F17, exec, nautilus --new-window
bind = , code:195, exec, nautilus --new-window
bind = CTRL, code:195, exec, nautilus --new-window
# tmux-style repeat: arrows stay in submap (no reset) so successive presses don't need Ctrl+BackSpace
binde = , left, movefocus, l
binde = , right, movefocus, r
binde = , up, movefocus, u
binde = , down, movefocus, d
# allow holding CTRL inside submap too (Ctrl+BackSpace then hold Ctrl + arrows)
binde = CTRL, left, movefocus, l
binde = CTRL, right, movefocus, r
binde = CTRL, up, movefocus, u
binde = CTRL, down, movefocus, d
# vim-style h/l also sticky (space is togglesplit, j/k free for future use)
binde = , h, movefocus, l
binde = , l, movefocus, r
binde = CTRL, h, movefocus, l
binde = CTRL, l, movefocus, r
binde = SHIFT, h, movewindow, l
binde = SHIFT, l, movewindow, r
binde = , H, movewindow, l
binde = , L, movewindow, r
# { / } — tmux prefix { } swap-pane analogy: move window left/right (sticky, like arrows)
# { = left, } = right — braceleft/braceright is "{" / "}" via Shift+[ / Shift+] on US; also cover bracketleft/bracketright and code:34/35 for robustness
binde = , braceleft, movewindow, l
binde = , braceright, movewindow, r
binde = , bracketleft, movewindow, l
binde = , bracketright, movewindow, r
binde = SHIFT, bracketleft, movewindow, l
binde = SHIFT, bracketright, movewindow, r
binde = , code:34, movewindow, l
binde = , code:35, movewindow, r
binde = SHIFT, code:34, movewindow, l
binde = SHIFT, code:35, movewindow, r
# swapwindow via CTRL+{ } (hold CTRL in submap)
binde = CTRL, braceleft, swapwindow, l
binde = CTRL, braceright, swapwindow, r
binde = CTRL, bracketleft, swapwindow, l
binde = CTRL, bracketright, swapwindow, r
binde = CTRL, code:34, swapwindow, l
binde = CTRL, code:35, swapwindow, r
# M / U — tmux marked-pane analogue (legacy conf backend, mirrors hyprland.lua).
# Ctrl+BackSpace M marks active window, Ctrl+BackSpace U drops it on current workspace.
# Shares ~/.cache/hypr-marked-window with hyprland.lua. Lower+upper+SHIFT
# variants so it works regardless of Caps/Shift sym handling. All sticky:
# only Esc or the lua 800ms timeout exits, so M/U chain into arrows/space/C-z.
bind = , m, exec, ~/.config/hypr/scripts/tmux-mark.sh
bind = CTRL, m, exec, ~/.config/hypr/scripts/tmux-mark.sh
bind = , M, exec, ~/.config/hypr/scripts/tmux-mark.sh
bind = CTRL, M, exec, ~/.config/hypr/scripts/tmux-mark.sh
bind = SHIFT, m, exec, ~/.config/hypr/scripts/tmux-mark.sh
bind = SHIFT, M, exec, ~/.config/hypr/scripts/tmux-mark.sh
bind = CTRL SHIFT, m, exec, ~/.config/hypr/scripts/tmux-mark.sh
bind = CTRL SHIFT, M, exec, ~/.config/hypr/scripts/tmux-mark.sh
bind = , u, exec, ~/.config/hypr/scripts/tmux-drop.sh
bind = CTRL, u, exec, ~/.config/hypr/scripts/tmux-drop.sh
bind = , U, exec, ~/.config/hypr/scripts/tmux-drop.sh
bind = CTRL, U, exec, ~/.config/hypr/scripts/tmux-drop.sh
bind = SHIFT, u, exec, ~/.config/hypr/scripts/tmux-drop.sh
bind = SHIFT, U, exec, ~/.config/hypr/scripts/tmux-drop.sh
bind = CTRL SHIFT, u, exec, ~/.config/hypr/scripts/tmux-drop.sh
bind = CTRL SHIFT, U, exec, ~/.config/hypr/scripts/tmux-drop.sh
# Only explicit cancel is Esc (plus the 800ms timeout in hyprland.lua).
# Re-pressing the prefix just re-arms tmux mode, never exits. No catchall:
# unknown keys fall through to the app but stay in tmux mode until timeout.
bind = , escape, submap, reset
bind = CTRL, BackSpace, submap, tmux
bind = CTRL SHIFT, BackSpace, submap, tmux
submap = reset

# Volume controls moved to custom.lua (PipeWire @DEFAULT_AUDIO_SINK@) to avoid duplicates

# Desktop toggle: F15 globally (keyboard-independent) -> kmscon tty1
# F15 (evdev 185 / XKB FK15) on any keyboard toggles VT; not tied to ROCCAT
# bind= normal, bindl= locked/lockscreen, code:193 (evdev 185 + 8) fallback for ru layout (resolve_binds_by_sym)
bind = , F15, exec, /usr/local/bin/desktop-toggle
bind = , code:193, exec, /usr/local/bin/desktop-toggle  # evdev 185 -> XKB keycode 193
bindl = , F15, exec, /usr/local/bin/desktop-toggle  # also when locked (hypridle)
bindl = , code:193, exec, /usr/local/bin/desktop-toggle
bind = CTRL_ALT, T, exec, /usr/local/bin/desktop-toggle  # combo fallback (all keyboards)
bind = CTRL_ALT, Delete, exec, /usr/local/bin/chvt-fast 2
bind = CTRL_ALT, code:119, exec, /usr/local/bin/chvt-fast 2  # Delete fallback (evdev 111 -> XKB 119)
bind = ALT, F15, exec, /usr/local/bin/desktop-toggle --stop
bind = ALT, code:193, exec, /usr/local/bin/desktop-toggle --stop
bind = SUPER ALT, F15, exec, /usr/local/bin/desktop-toggle --stop
bind = SUPER ALT, code:193, exec, /usr/local/bin/desktop-toggle --stop
bind = CTRL_ALT, F1, exec, /usr/local/bin/chvt-fast 1 || sudo chvt 1
# Exit Hyprland back to kmscon (like sway $mod+Shift+e)
bind = $mod SHIFT, E, exec, /usr/local/bin/desktop-toggle --stop

# Lucid launcher on bare SUPER — see SUPER bindings above

# Mouse-only: middle/right click desktop -> terminal (sway whole-window analogue via global)
# Hyprland doesn't have whole-window binds; use waybar pill instead (custom/terminal)

# Window rules
# Window rules: using new syntax (Hyprland 0.56). Example:
# windowrule { name = float pavucontrol; match:class = pavucontrol }

# Kitty liquid glass: kitty draws its own background alpha
# (background_opacity in kitty.conf) and the liquid-glass-hypr plugin draws
# real refraction glass behind it - the window equivalent of the quickshell
# LiquidGlassBg pills. Deliberately NO Hyprland opacity rule here: that would
# fade text too, while kitty's alpha keeps glyphs fully opaque. Rounding feeds
# the glass corner radii; no_blur because the plugin owns the backdrop blur
# (the compositor blur pass would frost OVER the refraction and bury it).
# Block+named form on purpose: one-liner windowrules silently failed to apply
# here (0.56), while named rules (also pushed live via hl.window_rule) work.
# Requires: hyprctl plugin load ~/src/liquid-glass-hypr/liquidglass.so
windowrule {
    name = lg-kitty-glass
    match:class = kitty
    no_blur = on
}
# tmux-style marked window highlight (legacy conf backend, mirrors the
# tmux-marked rule in hyprland.lua): orange active / dim bronze inactive.
windowrule { name = tmux-marked; match:tag = marked; border_color = rgb(ff9e64) rgb(7c5c3e) }
# (no wallpaper-capture rule: captures run under a private Xvfb and never
# map on the desktop - see capture-wallpapers.sh. A match:title rule was
# tried and never matched anything in this setup.)

cursor {
    hide_on_key_press = true
    inactive_timeout = 0
    hide_on_touch = true
    # 2026-09-19: instant system-wide vanish on idle with HW cursors on NVIDIA
    # 580 (GTX 1080 Ti) despite inactive_timeout=0 -> force software cursors.
    # Revert: set back to 2 (auto).
    no_hardware_cursors = 1
}

# Misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    # Windows-style activation focus: opening a link anywhere takes you to
    # the workspace of the window it opened in (see hyprland.lua).
    focus_on_activate = true
}
