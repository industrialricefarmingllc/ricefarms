# custom.conf - persistent hotkeys (left/right removed per request, only up/down for minimize/pin)
# F16 = open kitty (single press, no modifier — mirrors F15 desktop-toggle pattern)
bind = , F16, exec, kitty
bind = , code:194, exec, kitty  # XKB keycode for F16 (evdev 186 + 8)
# F17 = open nautilus
bind = , F17, exec, nautilus --new-window
bind = , code:195, exec, nautilus --new-window  # XKB keycode for F17 (evdev 187 + 8)
