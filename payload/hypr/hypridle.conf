# generated by lucid settings. edits are overwritten.
# turn Idle off in Lucid Settings to take this file back.
# gamepad input defers every step while a controller is in use.

general {
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = qs ipc call lock lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 60
    on-timeout = playerctl -as status 2>/dev/null | grep -q '^Playing$' || hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    condition_cmd = [ ! -x "$HOME/.local/bin/gamepad-idle-check" ] || "$HOME/.local/bin/gamepad-idle-check" 60
    condition_retry = 15
}
