# hypridle.conf — Lucid default
#
# Hyprland starts hypridle from the session. Lucid Settings owns this file when
# idle management is enabled and overwrites it with the stages configured on
# the Idle page. With no listeners here, hypridle is inert until that happens.
general {
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = qs ipc call lock lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
