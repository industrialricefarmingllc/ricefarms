# Nested test rig for liquid-glass-hypr. Runs INSIDE the live session as a
# plain window (wayland backend), so crashes here cost nothing.
#
#   WAYLAND_DISPLAY=wayland-1 Hyprland -c ~/src/liquid-glass-hypr/test/nested.conf
#
# Then, in another shell with WAYLAND_DISPLAY pointed at the nested socket:
#   qs -p ~/src/liquid-glass-hypr/test          # test shell (dock + geometry)
#   kitty                                       # text content behind the glass
# Screenshots from the host prove glass via the enabled keyword A/B test
# (see README "Nested testing").

monitor=WL-1,1280x720@60,0x0,1

plugin = /home/nicerice/src/liquid-glass-hypr/liquidglass.so

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = false
    key_press_enables_dpms = false
    background_color = rgb(202020)
}

input {
    follow_mouse = 0
}
