# Kitty config for 2560x1440 QHD - Noto Sans Mono Medium (weight 500)
font_family Noto Sans Mono
font_size 9.0
bold_font Noto Sans Mono Bold
# weight 500 is Kitty's medium; auto-maps to NotoSansMono-Medium.ttf

# Explicitly do NOT boot into tmux session defined in ~/.zshrc
# Kitty sets KITTY_WINDOW_ID + TERM=xterm-kitty automatically; NO_TMUX is an
# extra explicit flag checked by ~/.zshrc's guard so this behavior is obvious
# and survives TERM overrides.
env NO_TMUX=1
shell zsh

# Matugen colors - auto-generated, do not edit directly (see ~/.config/matugen/templates/kitty-colors.conf)
include matugen-colors.conf

# Liquid glass: the terminal draws NO background of its own - the
# liquid-glass-hypr plugin IS the background (same glass.frag as the
# quickshell pills). Text stays fully opaque. Tune live with kitty @ set-background-opacity.
# NOTE: no color pins here on purpose - foreground/palette follow matugen
# per theme mode (dark text on light glass in light mode), and the plugin
# reads the terminal tint from matugen-colors.conf (see window_tint_file).
background_opacity 0
dynamic_background_opacity yes

window_padding_width 8 12

# Disable "Are you sure you want to close this OS window?" prompt
# 0 = never confirm, even with running commands like opencode/chrome-mcp
confirm_os_window_close 0

# Free Ctrl+Enter / Ctrl+Shift+Enter for Neovim (VSCode: insert line below/above)
# Kitty default binds ctrl+shift+enter -> new_window (pane split), which would
# swallow the key before nvim ever sees it. no_op lets it pass through.
map ctrl+enter no_op
map ctrl+shift+enter no_op
