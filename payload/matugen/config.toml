[config]
fallback_color = "#89b4fa"
prefer = "saturation"

[config.wallpaper]
set = false
command = "awww img --transition-type wipe --transition-duration 1.2 {{image}}"

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'

[templates.hyprland_lua]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.foot]
input_path = '~/.config/matugen/templates/foot.ini'
output_path = '~/.config/foot/foot.ini.matugen'

[templates.dunst]
input_path = '~/.config/matugen/templates/dunstrc'
output_path = '~/.config/dunst/dunstrc'
[templates.quickshell_note]
input_path = '~/.config/matugen/templates/quickshell-note.txt'
output_path = '~/.cache/quickshell/matugen-colors.txt'

[templates.helium_theme]
input_path = '~/.config/matugen/templates/helium-theme.json'
output_path = '~/.local/share/helium-matugen-theme/manifest.json'

[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell-colors.json"
output_path = "~/.cache/quickshell/matugen.json"
# give kitty/GTK the exact surface Lucid draws widgets on (app-surface-sync.sh)

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/matugen-colors.conf'

[templates.kitty_font]
input_path = '~/.config/matugen/templates/kitty-font.conf'
output_path = '~/.config/kitty/font-mode.conf'

[templates.opencode]
input_path = '~/.config/matugen/templates/opencode.json'
output_path = '~/.config/opencode/themes/matugen.json'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
