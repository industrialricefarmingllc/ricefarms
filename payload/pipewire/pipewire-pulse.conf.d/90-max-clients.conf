# pipewire-pulse's client table can fill with orphaned subscribers (quickshell's
# `pactl subscribe` monitor leaves one behind each time it restarts). Once it is
# full, every `pactl` call fails with "too many client application connections",
# which is what killed the volume keys. The shell now reaps the orphans, but keep
# headroom here so a leak can never mute the session again.
pulse.properties = {
    server.address = [
        {
            address = "unix:native"
            max-clients = 256
        }
    ]
}
