[Service]
# Use OpenAL's PulseAudio backend instead of the PipeWire backend.
# The PipeWire backend pins the stream to whatever sink was default at startup
# (which at boot can be the VST_OUT null sink before the real card appears).
# Pulse streams carry no explicit target and follow the default sink, including
# when the WH-1000XM6 connects or the default changes.
Environment=ALSOFT_DRIVERS=pulse
