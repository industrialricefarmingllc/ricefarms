[Service]
# Quickshell 0.3.1/0.3.2 segfaults in QWindow::setScreen when its QML file
# watcher reloads the config while more than one output is connected
# (upstream issue #1098). Turning the watcher off avoids the crash; restart
# the shell (or the service) to pick up QML edits until that is fixed.
Environment=QS_DISABLE_FILE_WATCHER=1
# The same upstream bug crashes while tearing down windows on SIGTERM, so a
# stop/restart must not go through Quickshell's graceful handler.
KillSignal=SIGKILL
