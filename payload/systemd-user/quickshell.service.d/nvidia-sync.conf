[Service]
# NVIDIA's explicit-sync present path leaks sync_file fds on every surface
# commit (5-6 per launcher open); with the old 1024 soft limit that filled up
# and made EGL context creation fail, which is what turned a ~110 ms launcher
# open into a ~400 ms one.
# Scoped to the shell: implicit sync looks identical here, while the rest of
# the session keeps explicit sync.
Environment=__NV_DISABLE_EXPLICIT_SYNC=1
LimitNOFILE=524288
