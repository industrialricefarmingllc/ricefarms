[Unit]
# Three crashes in five minutes is enough; the old ten-in-a-minute loop just
# leaked another few hundred MB of VRAM on every restart.
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
# qs-web exits 75 when free VRAM is too low; do not restart into the same hole.
RestartPreventExitStatus=75
