[Service]
# The webengine drop-in starts qs-web directly, bypassing launch-shell.sh.
# launch-shell.sh is what detects the NVIDIA driver and selects Vulkan; on the
# OpenGL path Qt Quick falls back to the basic 60 Hz render loop under the
# proprietary driver, which is exactly what makes the launcher/placeholder
# animations look low-fps on a 165 Hz display. Force the backend the wrapper
# would have chosen; launch-shell.sh still honors an explicit override.
Environment=QSG_RHI_BACKEND=vulkan
