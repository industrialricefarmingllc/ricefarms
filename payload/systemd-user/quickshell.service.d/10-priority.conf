[Service]
# The shell must win the CPU/IO race when the launcher is opening: it is the
# only interactive surface that can freeze while the rest of the session is
# idle. -5 is deliberately not real-time: Hyprland still has to render the
# launcher, so starving the compositor would make the freeze worse.
Nice=-5
IOSchedulingClass=best-effort
IOSchedulingPriority=0
CPUWeight=300
IOWeight=300
