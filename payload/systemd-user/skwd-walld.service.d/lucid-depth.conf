[Service]
# Lucid's static-scene depth parallax. The patched renderer is a small fork of
# skwd-wall-vk (see ~/src/skwd-suite); it reads per-scene depth sidecars from
# the cache and applies the parallax only to the scene's static image layer.
Environment=SKWD_WALL_PAPER_VK=/home/nicerice/.local/bin/skwd-wall-vk-lucid
Environment=SKWD_VK_SCENE_DEPTH_DIR=/home/nicerice/.cache/liquid-shell/we-depth
Environment=SKWD_VK_SCENE_POINTER_FILE=/run/user/1000/lucid-scene-pointer
# skwd-deck launches the renderer with weRender.fps from config.json; this is a
# fallback only when running the renderer directly.
Environment=SKWD_PAPER_WE_FPS=60
