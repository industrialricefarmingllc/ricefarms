# /etc/kmscon/kmscon.conf - GPU-accelerated KMS console for TrueColor
# kmscon on tty1+tty2 via kmsconvt@.service (256-color, xterm-256color)
# Docs: man kmscon

### GPU / DRM - test no-hwaccel for 60Hz beat flicker at 165Hz native
# hwaccel off = software renderer (more stable on nouveau legacy, no atomic)
no-hwaccel
drm
gpus=all
use-original-mode
multi-monitor=clone
#mode=2560x1440
#rotate=normal

### Font - GitLab Mono (based on JetBrains Mono, ligatures disabled, backtick fixed)
### Detected Dell S2417DG 24" 2560x1440 @ 122.7 DPI (DP-3, 53x30cm) -> 20px = 11.7pt @ 122 DPI (was 14px=8.2pt tiny), correct for 122 DPI QHD
### For 4K 3840x2160 @ 184 DPI use 18-20px (scale 1.5)
font-engine=pango
font-name=GitLab Mono
font-size=20

### Keyboard - US pc105
xkb-layout=us
xkb-model=pc105+inet
xkb-options=terminate:ctrl_alt_bksp
xkb-repeat-delay=125
xkb-repeat-rate=13

### Terminal
term=xterm-256color
palette=vga
sb-size=10000
no-blink
no-bell
reset-env
backspace-delete

### Power
dpms-timeout=600

### Behavior
session-max=6
session-control
# Allow Ctrl+Logo+Right/Left to switch kmscon sessions, Logo = Super
grab-session-next=<Ctrl><Logo>Right
grab-session-prev=<Ctrl><Logo>Left
grab-terminal-new=<Ctrl><Logo>Return
