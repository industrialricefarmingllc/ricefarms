# Search by file paths
set -g default-terminal "tmux-256color"
# Truecolor passthrough, scoped to kitty only (only TERM we KNOW is 24-bit).
# Tc = tmux <3.2 name, RGB = 3.2+ name; both set for compat across 3.3a/3.7c.
set-option -sa terminal-overrides ",xterm-kitty:Tc"
set-option -sa terminal-overrides ",xterm-kitty:RGB"

# --- extended keys (CSI u / Kitty keyboard): Ctrl+Enter etc. ---
# Lets tmux request `extkeys` from kitty and forward distinct
# Ctrl+Enter (CSI 13;5u) to apps. Only takes effect over ssh/ET —
# mosh 1.4.0 swallows the negotiation, so `MOSH=0 d.sh` is required.
set -s extended-keys on
set -as terminal-features ',xterm-kitty:extkeys'

# --- OSC52 clipboard: remote -> local (ssh/mosh 1.4+ -> kitty) ---
# `set-clipboard on` (not `external`) lets apps inside tmux (nvim, osc52
# helper, inner/nested tmux) set the outer terminal clipboard, not just
# tmux's own copy-mode copies. Required on the OUTER tmux for nested
# (local tmux + remote tmux via `d`) passthrough.
# `allow-passthrough on` lets raw DCS-wrapped OSC52 from apps flow through
# (tmux >= 3.3a; off by default since 3.3a). Both sides need this.
set -s set-clipboard on
set -g allow-passthrough on
setw -g allow-passthrough on

bind-key f copy-mode \; send-keys -X search-backward \
  '(^|/|\<|[[:space:]"])((\.|\.\.)|[[:alnum:]~_"-]*)((/[][[:alnum:]_.#$%&+=@"-]+)+([/ "]|\.([][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)?(:[0-9]+)?)|[][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)(:[0-9]+)?)|(/[][[:alnum:]_.#$%&+=@"-]+){2,}([/ "]|\.([][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)?(:[0-9]+)?)|[][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)(:[0-9]+)?)?|(\.|\.\.)/([][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)?(:[0-9]+)?))'

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind r command-prompt -p "Rename window:" "rename-window '%%'"

unbind C-b
# NOTE (2026-09-06): Ctrl+Backspace was tried as prefix but is undeliverable
# on tty1/kmscon — libtsm's BackSpace case ignores modifiers and
# --backspace-delete (on) maps both Backspace and Ctrl+Backspace to 0x7f,
# so tmux cannot distinguish them. C-z (0x1a) IS distinct there.
# Hyprland keeps Ctrl+Backspace (compositor sees the real key); tmux keeps C-z.
set-option -g prefix C-z
bind-key C-z send-prefix
bind-key s copy-mode \; command-prompt -I "#{pane_search_string}" -T search -p "(search up)" { send-keys -X search-backward -- "%%" }
bind-key S copy-mode \; command-prompt -I "#{pane_search_string}" -T search -p "(search down)" { send-keys -X search-forward -- "%%" }

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g mouse on
# Fix multi-client overflow: tmux window was 7 rows larger than pts/0 (213x53) when
# tty3 (213x60) and konsole (139x28) shared session `main` with `window-size latest`.
# `latest` makes window follow last client; with same window viewed by multiple
# clients one always overflows. Use `smallest` (fits smallest viewer, large gets
# letterbox) + aggressive-resize per-window isolation.
set -g aggressive-resize on
setw -g aggressive-resize on
set -g window-size smallest
set -g focus-events on

set -g set-titles on
set -g set-titles-string "#T"

# ponytail: escape-time 10 — 0 leaked Windows Terminal DA responses through as text
set -g escape-time 50

# Don't ask before killing panes
bind-key x kill-pane
bind-key '&' kill-window

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
#set -g visual-activity off
#set -g visual-bell off
#sett -g visual-silence off
#setw -g monitor-activity off
#set -g bell-action none

# clock mode
# setw -g clock-mode-colour yellow
set -g status-right ''

# copy mode
setw -g mode-style 'fg=black bg=white bold'

# panes
set -g pane-border-style 'fg=#444444'
set -g pane-active-border-style 'fg=#ff6102'

# statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'fg=white'

set -g status-left ''
set -g status-left-length 10

#active
setw -g window-status-current-style 'fg=white bg=black'
setw -g window-status-current-format ' #I #W#{?window_zoomed_flag, ❏,}#{?window_activity_flag, ⬓,}#{?window_marked_flag, M,}'

# inactive
setw -g window-status-style 'fg=colour8 bg=black'
setw -g window-status-format ' #I #W#{?window_zoomed_flag, ❏,}#{?window_activity_flag, ⬓,}#{?window_marked_flag, M,}'
setw -g monitor-activity on

# don't recolor tabs on activity/bell; just show the flag char
setw -g window-status-activity-style 'fg=colour8 bg=black'
setw -g window-status-bell-style 'fg=#ff6102 bg=black'

# messages
set -g message-style 'fg=yellow bg=green bold'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'openjck/tmux-auto-resize-panes-evenly'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'guysoft/tmux-resurrect-opencode-sessions'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# --- tmux-resurrect (state capture/restore) ---
# Save/restore your panes’ command output and layout.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-bins 'on'
set -g @resurrect-hook 'on'

# (Optional) if you want to auto-save when exiting tmux
set -g @resurrect-save-on-exit 'on'

# Restore behavior (key idea: restore without you manually invoking it)
set -g @resurrect-restore-on-start 'on'

# --- tmux-continuum (auto-save schedule + restore trigger) ---
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'  # minutes; 1 = minimum

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set -g exit-empty off  # keep server alive for autologin restore (start-server)

run '~/.tmux/plugins/tpm/tpm'

# silent manual save (resurrect's default shows a popup)
bind-key C-s run-shell -b '~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet'

# Fix multi-client overflow: must be AFTER tpm (tpm plugins override hooks)
# Auto-shrink windows to smallest viewer on client changes (prevents 7-row
# overflow when switching windows or attaching a smaller terminal). Use -a
# (smallest) so small terminal never overflows; large gets letterbox.
set-hook -g client-attached 'run-shell "tmux resize-window -a -t \"#{session_name}:#{window_index}\" 2>/dev/null || true"'
set-hook -g client-detached 'run-shell "tmux resize-window -a 2>/dev/null || true"'
set-hook -g client-resized 'run-shell "tmux resize-window -a -t \"#{session_name}:#{window_index}\" 2>/dev/null; tmux select-layout -E 2>/dev/null || true"'
set-hook -g after-select-window 'run-shell "tmux resize-window -a -t \"#{session_name}:#{window_index}\" 2>/dev/null || true"'
set-hook -g after-select-layout 'run-shell "tmux resize-window -a 2>/dev/null || true"'

# PageUp/PageDown scroll pane history (fix: was passing to zsh history)
# If alternate screen is active (vim/less), pass through; otherwise enter copy-mode and scroll.
bind -n PPage if-shell -F "#{alternate_on}" "send-keys PPage" "copy-mode -e; send-keys -X page-up"
bind -n NPage if-shell -F "#{alternate_on}" "send-keys NPage" "copy-mode -e; send-keys -X page-down"

# --- sticky prefix: single C-z chains into ANY bind until repeat-time ---
# One C-z press arms the prefix; every prefix bind below has -r so chained
# keys do NOT need C-z re-pressed. Only the repeat-time timeout (pinned
# at the current 1000ms value, matches Hyprland C-BackSpace TMUX_TIMEOUT_MS) ends the chain - mirrors the Hyprland
# Ctrl+BackSpace sticky submap (only Esc/timeout exits there).
# NOTE: destructive keys (x kill-pane, & kill-window, c new-window) are
# also repeatable now: a fast double-tap within 1000ms fires twice.
# Generated from tmux 3.7c `tmux list-keys -T prefix` on 2026-09-06 (repeat-time raised 500 -> 1000 same day).
# Generated from tmux 3.7c `tmux list-keys -T prefix` on 2026-09-06.
# Regenerate after tmux upgrades or when adding binds:
#   tmux list-keys -T prefix | grep -v 'bind-key -r' | sed -E 's/^bind-key +(-T prefix)/bind-key -r \1/'
set -g repeat-time 1000
bind-key -r -T prefix Space   next-layout
bind-key -r -T prefix !       break-pane
bind-key -r -T prefix \#      list-buffers
bind-key -r -T prefix \$      command-prompt -I "#S" { rename-session "%%" }
bind-key -r -T prefix &       kill-window
bind-key -r -T prefix \'      command-prompt -T window-target -p index { select-window -t ":%%" }
bind-key -r -T prefix (       switch-client -p
bind-key -r -T prefix )       switch-client -n
bind-key -r -T prefix *       new-pane
bind-key -r -T prefix ,       command-prompt -I "#W" { rename-window "%%" }
bind-key -r -T prefix -       split-window -v
bind-key -r -T prefix .       command-prompt -T target { move-window -t "%%" }
bind-key -r -T prefix /       command-prompt -k -p key { list-keys -1N "%%" }
bind-key -r -T prefix 0       select-window -t :=0
bind-key -r -T prefix 1       select-window -t :=1
bind-key -r -T prefix 2       select-window -t :=2
bind-key -r -T prefix 3       select-window -t :=3
bind-key -r -T prefix 4       select-window -t :=4
bind-key -r -T prefix 5       select-window -t :=5
bind-key -r -T prefix 6       select-window -t :=6
bind-key -r -T prefix 7       select-window -t :=7
bind-key -r -T prefix 8       select-window -t :=8
bind-key -r -T prefix 9       select-window -t :=9
bind-key -r -T prefix :       command-prompt
bind-key -r -T prefix \;      last-pane
bind-key -r -T prefix <       display-menu -T "#[align=centre]#{window_index}:#{window_name}" -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window }
bind-key -r -T prefix =       choose-buffer -Z
bind-key -r -T prefix >       display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -x P -y P "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "#{?#{!:#{pane_floating_flag}},Horizontal Split,}" h { split-window -h } "#{?#{!:#{pane_floating_flag}},Vertical Split,}" v { split-window -v } '' "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}" u { swap-pane -U } "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' Kill X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z }
bind-key -r -T prefix ?       list-keys -N
bind-key -r -T prefix C       customize-mode -Z
bind-key -r -T prefix D       choose-client -Z
bind-key -r -T prefix E       select-layout -E
bind-key -r -T prefix I       run-shell /home/nicerice/.tmux/plugins/tpm/bindings/install_plugins
bind-key -r -T prefix L       switch-client -l
bind-key -r -T prefix M       select-pane -M
bind-key -r -T prefix R       run-shell " \t\t\ttmux source-file /home/nicerice/.tmux.conf > /dev/null; \t\t\ttmux display-message 'Sourced /home/nicerice/.tmux.conf!'"
bind-key -r -T prefix S       copy-mode \; command-prompt -I "#{pane_search_string}" -T search -p "(search down)" { send-keys -X search-forward -- "%%" }
bind-key -r -T prefix U       run-shell /home/nicerice/.tmux/plugins/tpm/bindings/update_plugins
bind-key -r -T prefix [       copy-mode
bind-key -r -T prefix ]       paste-buffer -p
bind-key -r -T prefix c       new-window
bind-key -r -T prefix d       detach-client
bind-key -r -T prefix f       copy-mode \; send-keys -X search-backward "(^|/|\\<|[[:space:]\"])((\\.|\\.\\.)|[[:alnum:]~_\"-]*)((/[][[:alnum:]_.#$%&+=@\"-]+)+([/ \"]|\\.([][[:alnum:]_.#$%&+=@\"-]+(:[0-9]+)?(:[0-9]+)?)|[][[:alnum:]_.#$%&+=@\"-]+(:[0-9]+)(:[0-9]+)?)|(/[][[:alnum:]_.#$%&+=@\"-]+){2,}([/ \"]|\\.([][[:alnum:]_.#$%&+=@\"-]+(:[0-9]+)?(:[0-9]+)?)|[][[:alnum:]_.#$%&+=@\"-]+(:[0-9]+)(:[0-9]+)?)?|(\\.|\\.\\.)/([][[:alnum:]_.#$%&+=@\"-]+(:[0-9]+)?(:[0-9]+)?))"
bind-key -r -T prefix i       display-message
bind-key -r -T prefix l       last-window
bind-key -r -T prefix m       select-pane -m
bind-key -r -T prefix n       next-window
bind-key -r -T prefix o       select-pane -t :.+
bind-key -r -T prefix p       previous-window
bind-key -r -T prefix q       display-panes
bind-key -r -T prefix r       command-prompt -p "Rename window:" "rename-window '%%'"
bind-key -r -T prefix s       copy-mode \; command-prompt -I "#{pane_search_string}" -T search -p "(search up)" { send-keys -X search-backward -- "%%" }
bind-key -r -T prefix t       clock-mode
bind-key -r -T prefix w       choose-tree -Zw
bind-key -r -T prefix x       kill-pane
bind-key -r -T prefix z       resize-pane -Z
bind-key -r -T prefix \{      swap-pane -U
bind-key -r -T prefix |       split-window -h
bind-key -r -T prefix \}      swap-pane -D
bind-key -r -T prefix \~      show-messages
bind-key -r -T prefix PPage   copy-mode -u
