# Do not use the OS keyring (gnome-keyring/libsecret) for Chromium's
# password/cookie encryption. The session has no default keyring and no
# PAM unlock, so Chromium would otherwise prompt to create/unlock one on
# every launch.
#
# Trade-off: saved passwords use Chromium's built-in "basic" store instead
# of being protected by a keyring. File permissions still protect the profile.
--password-store=basic

# Always expose the Chrome DevTools Protocol on loopback so the reverse SSH
# forward in ~/fw.sh (-R 127.0.0.1:9222:127.0.0.1:9222) works from the dev box.
# Loopback-only: not reachable from the LAN. Note that anything that can reach
# 127.0.0.1:9222 (i.e. anything on the dev host, through the tunnel) has full
# control over this browser profile, including its cookies.
--remote-debugging-port=9222
--remote-debugging-address=127.0.0.1
